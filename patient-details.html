<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Patient Details - VF Prediction</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #0b1d3a, #020617);
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 420px;
      background: rgba(255, 255, 255, 0.06);
      padding: 28px;
      border-radius: 14px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      letter-spacing: 1px;
    }

    label {
      font-size: 14px;
      margin-top: 12px;
      display: block;
      color: #cbd5f5;
    }

    input, select, button {
      width: 100%;
      margin-top: 6px;
      padding: 10px;
      border-radius: 6px;
      border: none;
      outline: none;
      font-size: 14px;
    }

    input, select {
      background: #0f172a;
      color: #fff;
    }

    button {
      margin-top: 20px;
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: #fff;
      cursor: pointer;
      font-weight: 600;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .status {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
      color: #93c5fd;
    }
  </style>
</head>

<body>
  <div class="container">
    <h2>Patient Details</h2>

    <form id="patientForm">
      <label>Fundus Image *</label>
      <input type="file" id="fundusImage" accept="image/*" required />

      <label>Age</label>
      <input type="number" id="age" placeholder="e.g. 55" />

      <label>Intraocular Pressure (IOP)</label>
      <input type="number" id="iop" step="0.1" placeholder="e.g. 21.5" />

      <label>Central Corneal Thickness (CCT)</label>
      <input type="number" id="cct" placeholder="e.g. 520" />

      <label>Gender</label>
      <select id="gender">
        <option value="">Select</option>
        <option value="0">Male</option>
        <option value="1">Female</option>
      </select>

      <button type="submit" id="submitBtn">Run Prediction</button>
    </form>

    <div class="status" id="statusText"></div>
  </div>

  <script>
    const form = document.getElementById("patientForm");
    const statusText = document.getElementById("statusText");
    const submitBtn = document.getElementById("submitBtn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const imageInput = document.getElementById("fundusImage");
      if (!imageInput.files.length) {
        alert("Please upload a fundus image.");
        return;
      }

      submitBtn.disabled = true;
      statusText.textContent = "Running inference... Please wait.";

      const formData = new FormData();
      // 🔑 FIXED: Changed key from "image" to "fundus_image" to match Flask backend
      formData.append("fundus_image", imageInput.files[0]); 
      formData.append("age", document.getElementById("age").value || "");
      formData.append("iop", document.getElementById("iop").value || "");
      formData.append("cct", document.getElementById("cct").value || "");
      formData.append("gender", document.getElementById("gender").value || "");

      try {
        const response = await fetch("/predict", {
          method: "POST",
          body: formData
        });

        if (!response.ok) {
          throw new Error("Inference failed");
        }

        const predictionResult = await response.json();

        localStorage.setItem(
          "prediction_result",
          JSON.stringify(predictionResult)
        );

        // 🔑 FIXED: Changed to Flask template route matching /prediction-result
        window.location.href = "/prediction-result"; 

      } catch (error) {
        console.error(error);
        statusText.textContent =
          "Prediction failed. Please try again.";
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
