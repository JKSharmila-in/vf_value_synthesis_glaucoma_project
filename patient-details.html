<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Patient Details | VF Value Synthesis</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center">

  <div class="bg-white w-full max-w-4xl rounded-xl shadow-lg p-8">
    
    <!-- Header -->
    <h1 class="text-3xl font-bold text-gray-800 mb-6 text-center">
      Patient Details & Fundus Upload
    </h1>

    <!-- Form -->
    <form id="patientForm" class="grid grid-cols-1 md:grid-cols-2 gap-6">

      <!-- Patient Name -->
      <div>
        <label class="block text-sm font-semibold text-gray-600 mb-1">
          Patient Name
        </label>
        <input type="text" required
          class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" />
      </div>

      <!-- Age -->
      <div>
        <label class="block text-sm font-semibold text-gray-600 mb-1">
          Age
        </label>
        <input type="number" required
          class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" />
      </div>

      <!-- Gender -->
      <div>
        <label class="block text-sm font-semibold text-gray-600 mb-1">
          Gender
        </label>
        <select required
          class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
          <option value="">Select</option>
          <option>Male</option>
          <option>Female</option>
          <option>Other</option>
        </select>
      </div>

      <!-- Eye -->
      <div>
        <label class="block text-sm font-semibold text-gray-600 mb-1">
          Eye
        </label>
        <select required
          class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
          <option value="">Select</option>
          <option>Right Eye</option>
          <option>Left Eye</option>
        </select>
      </div>

      <!-- Fundus Upload -->
      <div class="md:col-span-2">
        <label class="block text-sm font-semibold text-gray-600 mb-2">
          Upload Fundus Image
        </label>
        <input id="fundusInput" type="file" accept="image/*" required
          class="block w-full text-sm text-gray-600
          file:mr-4 file:py-2 file:px-4
          file:rounded-lg file:border-0
          file:text-sm file:font-semibold
          file:bg-blue-50 file:text-blue-700
          hover:file:bg-blue-100" />
      </div>

      <!-- Image Preview -->
      <div class="md:col-span-2 flex justify-center">
        <img id="previewImage"
          class="hidden mt-4 max-h-64 rounded-lg border"
          alt="Fundus Preview" />
      </div>

      <!-- Predict Button -->
      <div class="md:col-span-2 text-center mt-4">
        <button type="submit"
          class="bg-blue-600 text-white px-8 py-3 rounded-lg font-semibold hover:bg-blue-700 transition">
          Predict VF Values
        </button>
      </div>

    </form>

    <!-- Loader -->
    <div id="loader" class="hidden text-center mt-6">
      <p class="text-blue-600 font-semibold animate-pulse">
        Running model inference...
      </p>
    </div>

  </div>

  <!-- Script -->
  <script>
    const form = document.getElementById("patientForm");
    const fundusInput = document.getElementById("fundusInput");
    const previewImage = document.getElementById("previewImage");
    const loader = document.getElementById("loader");

    // Preview uploaded image
    fundusInput.addEventListener("change", () => {
      const file = fundusInput.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = e => {
        previewImage.src = e.target.result;
        previewImage.classList.remove("hidden");
      };
      reader.readAsDataURL(file);
    });

    // Submit form → Flask backend
    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const file = fundusInput.files[0];
      if (!file) {
        alert("Please upload a fundus image");
        return;
      }

      loader.classList.remove("hidden");

      const formData = new FormData();
      formData.append("image", file);

      try {
        const response = await fetch("/predict", {
          method: "POST",
          body: formData
        });

        const data = await response.json();

        if (!data.success) {
          throw new Error("Prediction failed");
        }

        // Save VF values for next page
        sessionStorage.setItem(
          "vf_values",
          JSON.stringify(data.vf_values)
        );

        // Redirect to result page
        window.location.href = "/prediction-result";

      } catch (error) {
        alert("Error during prediction. Check server logs.");
        console.error(error);
      } finally {
        loader.classList.add("hidden");
      }
    });
  </script>

</body>
</html>
