<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prediction Result - VF Value Synthesis</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;900&family=Barlow+Condensed:wght@700;900&display=swap');

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Barlow', sans-serif;
  background: radial-gradient(circle at top, #0c1f4a, #03080f);
  color: #fff;
  min-height: 100vh;
  padding: 28px;
}

.header {
  text-align: center;
  margin-bottom: 24px;
}

.header h1 {
  font-family: 'Barlow Condensed';
  font-size: 36px;
  letter-spacing: 3px;
}

.header p {
  color: #7a91b5;
  font-size: 14px;
}

.back-btn {
  position: absolute;
  left: 28px;
  top: 28px;
  color: #4d84ff;
  cursor: pointer;
  font-size: 14px;
}

.layout {
  display: grid;
  grid-template-columns: 260px 1fr 1fr;
  gap: 20px;
  max-width: 1200px;
  margin: auto;
}

.card {
  background: rgba(8,22,41,0.85);
  border-radius: 10px;
  padding: 18px;
  border: 1px solid rgba(255,255,255,0.08);
}

.card h3 {
  font-size: 13px;
  letter-spacing: 1px;
  color: #4d84ff;
  margin-bottom: 12px;
}

.info-item {
  font-size: 14px;
  margin-bottom: 14px;
  color: #cbd7ff;
}

.fundus-img {
  width: 100%;
  border-radius: 8px;
}

.vf-grid {
  display: grid;
  grid-template-columns: repeat(9, 1fr);
  gap: 8px;
  text-align: center;
  font-size: 13px;
}

.vf-cell {
  background: #fff;
  color: #000;
  padding: 6px 0;
  border-radius: 4px;
}

.footer {
  margin-top: 28px;
  text-align: center;
}

.footer button {
  margin: 0 10px;
  padding: 12px 26px;
  border-radius: 6px;
  border: none;
  cursor: pointer;
  font-weight: 600;
}

.download {
  background: transparent;
  border: 1px solid #4d84ff;
  color: #4d84ff;
}

.feedback {
  background: #4d84ff;
  color: #fff;
}

.note {
  margin-top: 16px;
  font-size: 12px;
  color: #7a91b5;
}
</style>
</head>

<body>

<div class="back-btn" onclick="history.back()">← Back</div>

<div class="header">
  <h1>PREDICTION RESULT</h1>
  <p>Visual Field (VF) Prediction from Fundus Image</p>
</div>

<div class="layout">

  <!-- Patient Info -->
  <div class="card">
    <h3>PATIENT INFORMATION</h3>
    <div class="info-item">Age: <span id="age"></span></div>
    <div class="info-item">Gender: <span id="gender"></span></div>
    <div class="info-item">IOP (mmHg): <span id="iop"></span></div>
    <div class="info-item">CCT (µm): <span id="cct"></span></div>
  </div>

  <!-- Fundus Image -->
  <div class="card">
    <h3>FUNDUS IMAGE (INPUT)</h3>
    <img id="fundusImg" class="fundus-img">
  </div>

  <!-- VF Prediction -->
  <div class="card">
    <h3>PREDICTED VISUAL FIELD (dB)</h3>
    <div class="vf-grid" id="vfGrid"></div>
  </div>

</div>

<div class="footer">
  <button class="download">⬇ Download Report</button>
  <button class="feedback">Submit Feedback</button>

  <div class="note">
    This prediction is generated by an AI model and should be interpreted by an eye care professional.
  </div>
</div>

<script>
/* Load stored data */
const patient = JSON.parse(sessionStorage.getItem('patientData'));
const vfValues = JSON.parse(sessionStorage.getItem('vfValues'));
const fundusImage = sessionStorage.getItem('fundusImage');

/* Fill patient info */
document.getElementById('age').textContent = patient.age ?? '-';
document.getElementById('gender').textContent =
  patient.gender === 'M' ? 'Male' :
  patient.gender === 'F' ? 'Female' : '-';
document.getElementById('iop').textContent = patient.iop ?? '-';
document.getElementById('cct').textContent = patient.cct ?? '-';

/* Show fundus image */
document.getElementById('fundusImg').src = fundusImage;

/* Render VF grid */
const grid = document.getElementById('vfGrid');
vfValues.forEach(v => {
  const cell = document.createElement('div');
  cell.className = 'vf-cell';
  cell.textContent = v;
  grid.appendChild(cell);
});
</script>

</body>
</html>
