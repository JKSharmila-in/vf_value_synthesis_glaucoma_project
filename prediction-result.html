<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Prediction Result</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Inter, sans-serif;
  background: radial-gradient(circle at top, #0d1b2a, #020617);
  color: #fff;
}

.container {
  padding: 30px;
}

h1 {
  text-align: center;
  margin-bottom: 10px;
}

.subtitle {
  text-align: center;
  color: #9bb0ff;
  margin-bottom: 30px;
}

.grid {
  display: grid;
  grid-template-columns: 260px 1fr 1fr;
  gap: 20px;
}

.card {
  background: rgba(255,255,255,0.05);
  padding: 20px;
  border-radius: 16px;
}

.info span {
  font-size: 12px;
  color: #9bb0ff;
}

.info div {
  margin-bottom: 18px;
}

img {
  width: 100%;
  border-radius: 12px;
}

.vf-grid {
  display: grid;
  grid-template-columns: repeat(10, 1fr);
  gap: 6px;
}

.vf {
  padding: 6px 0;
  background: #020617;
  border-radius: 6px;
  text-align: center;
  font-size: 12px;
}

.low { color: #f87171; }
.mid { color: #facc15; }
.high { color: #4ade80; }
</style>
</head>

<body>
<div class="container">
  <h1>PREDICTION RESULT</h1>
  <div class="subtitle">Visual Field Prediction from Fundus Image</div>

  <div class="grid">
    <div class="card info">
      <h3>Patient Info</h3>
      <div><span>Age</span><div id="age"></div></div>
      <div><span>Gender</span><div id="gender"></div></div>
      <div><span>IOP</span><div id="iop"></div></div>
      <div><span>CCT</span><div id="cct"></div></div>
    </div>

    <div class="card">
      <h3>Fundus Image</h3>
      <img id="fundusImg">
    </div>

    <div class="card">
      <h3>Predicted VF (dB)</h3>
      <div class="vf-grid" id="vfGrid"></div>
    </div>
  </div>
</div>

<script>
const data = JSON.parse(localStorage.getItem("predictionData"));

if (data) {
  age.innerText = data.age;
  gender.innerText = data.gender;
  iop.innerText = data.iop;
  cct.innerText = data.cct;
  fundusImg.src = data.fundusImage;

  data.vfValues.flat().forEach(v => {
    const d = document.createElement("div");
    d.className = "vf " + (v < 15 ? "low" : v < 25 ? "mid" : "high");
    d.innerText = v;
    vfGrid.appendChild(d);
  });
}
</script>
</body>
</html>
