<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Prediction Result | Glaucoma Detection</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      background: #0f172a;
      color: #e5e7eb;
    }
  </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4">

  <div class="max-w-6xl w-full bg-slate-900 rounded-2xl shadow-xl p-6 space-y-6">

    <!-- Header -->
    <div class="text-center">
      <h1 class="text-3xl font-bold text-cyan-400">
        Glaucoma Prediction Result
      </h1>
      <p class="text-slate-400 mt-1">
        AI-assisted screening summary
      </p>
    </div>

    <!-- Main Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

      <!-- Fundus Image -->
      <div class="bg-slate-800 rounded-xl p-4 flex flex-col items-center">
        <h2 class="text-lg font-semibold mb-3">Fundus Image</h2>
        <img
          id="fundusImg"
          src=""
          alt="Input fundus image"
          class="w-full max-w-sm rounded-lg border border-slate-600"
        />
      </div>

      <!-- Patient Details -->
      <div class="bg-slate-800 rounded-xl p-4">
        <h2 class="text-lg font-semibold mb-4">Patient Details</h2>

        <div class="grid grid-cols-2 gap-4 text-sm">
          <div>
            <span class="text-slate-400">Age</span>
            <p id="age" class="text-lg font-medium">—</p>
          </div>

          <div>
            <span class="text-slate-400">Gender</span>
            <p id="gender" class="text-lg font-medium">—</p>
          </div>

          <div>
            <span class="text-slate-400">IOP (mmHg)</span>
            <p id="iop" class="text-lg font-medium">—</p>
          </div>

          <div>
            <span class="text-slate-400">CCT (µm)</span>
            <p id="cct" class="text-lg font-medium">—</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Prediction Section -->
    <div class="bg-slate-800 rounded-xl p-6 text-center">
      <h2 class="text-xl font-semibold mb-2">Prediction</h2>

      <!-- You can dynamically change this later -->
      <p
        id="predictionText"
        class="text-2xl font-bold text-green-400"
      >
        Low Risk of Glaucoma
      </p>

      <p class="text-slate-400 mt-2 text-sm">
        This result is generated using AI model inference.
        Not a clinical diagnosis.
      </p>
    </div>

    <!-- Buttons -->
    <div class="flex justify-center gap-4">
      <a
        href="index.html"
        class="px-6 py-2 rounded-lg bg-cyan-500 hover:bg-cyan-600 text-slate-900 font-semibold"
      >
        New Test
      </a>

      <button
        onclick="window.print()"
        class="px-6 py-2 rounded-lg bg-slate-700 hover:bg-slate-600 font-semibold"
      >
        Print
      </button>
    </div>

  </div>

  <!-- SCRIPT -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {

      // Read stored data
      const fundusImage = sessionStorage.getItem("fundusImage");
      const patientData = JSON.parse(
        sessionStorage.getItem("patientData") || "{}"
      );

      // Debug (remove later)
      console.log("Fundus Image:", fundusImage);
      console.log("Patient Data:", patientData);

      // Set fundus image
      const img = document.getElementById("fundusImg");
      if (img && fundusImage) {
        img.src = fundusImage;
      }

      // Set patient values
      document.getElementById("age").textContent =
        patientData.age || "—";

      document.getElementById("gender").textContent =
        patientData.gender === "M"
          ? "Male"
          : patientData.gender === "F"
          ? "Female"
          : "—";

      document.getElementById("iop").textContent =
        patientData.iop || "—";

      document.getElementById("cct").textContent =
        patientData.cct || "—";

    });
  </script>

</body>
</html>
