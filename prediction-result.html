<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Patient Details</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <style>
    body {
      margin: 0;
      font-family: Inter, sans-serif;
      background: radial-gradient(circle at top, #0d1b2a, #020617);
      color: #fff;
    }

    .container {
      max-width: 900px;
      margin: 40px auto;
      padding: 30px;
      background: rgba(255,255,255,0.05);
      border-radius: 16px;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    label {
      font-size: 13px;
      color: #9bb0ff;
      margin-bottom: 6px;
      display: block;
    }

    input, select {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: #020617;
      color: #fff;
    }

    input[type="file"] {
      background: transparent;
    }

    .actions {
      margin-top: 30px;
      text-align: center;
    }

    button {
      padding: 14px 26px;
      font-size: 15px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      background: linear-gradient(135deg, #2563eb, #4f46e5);
      color: #fff;
    }
  </style>
</head>

<body>
<div class="container">
  <h1>Patient Details</h1>

  <div class="grid">
    <div>
      <label>Age</label>
      <input type="number" id="age">
    </div>

    <div>
      <label>Gender</label>
      <select id="gender">
        <option value="">Select</option>
        <option>Male</option>
        <option>Female</option>
      </select>
    </div>

    <div>
      <label>IOP (mmHg)</label>
      <input type="number" id="iop">
    </div>

    <div>
      <label>CCT (µm)</label>
      <input type="number" id="cct">
    </div>

    <div style="grid-column: span 2;">
      <label>Fundus Image</label>
      <input type="file" id="fundus" accept="image/*">
    </div>
  </div>

  <div class="actions">
    <button onclick="submitData()">Run Prediction</button>
  </div>
</div>

<script>
function submitData() {
  const file = document.getElementById("fundus").files[0];
  if (!file) {
    alert("Upload fundus image");
    return;
  }

  const reader = new FileReader();
  reader.onload = () => {
    localStorage.setItem("predictionData", JSON.stringify({
      age: document.getElementById("age").value,
      gender: document.getElementById("gender").value,
      iop: document.getElementById("iop").value,
      cct: document.getElementById("cct").value,
      fundusImage: reader.result,

      /* SAMPLE VF OUTPUT */
      vfValues: [
        [18,18,19,19,20,20,21,21,22,22],
        [20,20,20,20,19,19,19,19,20,20],
        [22,23,23,24,24,25,25,25,24,24],
        [24,24,24,24,25,25,26,27,26,25]
      ]
    }));

    window.location.href = "prediction-result.html";
  };
  reader.readAsDataURL(file);
}
</script>
</body>
</html>
