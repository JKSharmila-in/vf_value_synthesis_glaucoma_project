<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Prediction Result</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="css/style.css" />

  <style>
    body {
      margin: 0;
      font-family: "Inter", sans-serif;
      background: radial-gradient(circle at top, #0d1b2a, #020617);
      color: #fff;
    }

    .container {
      padding: 30px;
    }

    .title {
      text-align: center;
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #9bb0ff;
      margin-bottom: 30px;
    }

    .card-grid {
      display: grid;
      grid-template-columns: 260px 1fr 1fr;
      gap: 20px;
      align-items: stretch;
    }

    .card {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 14px;
      padding: 20px;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
    }

    /* Patient Info */
    .info-item {
      margin-bottom: 18px;
      font-size: 14px;
    }

    .info-item span {
      display: block;
      color: #8fb3ff;
      font-size: 12px;
      margin-bottom: 4px;
    }

    /* Fundus Image */
    .fundus-img {
      width: 100%;
      height: auto;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.1);
    }

    /* VF Grid */
    .vf-grid {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 6px;
      margin-top: 10px;
    }

    .vf-cell {
      background: #0f172a;
      border-radius: 6px;
      text-align: center;
      padding: 6px 0;
      font-size: 12px;
      color: #e5e7eb;
    }

    .vf-cell.low { color: #f87171; }
    .vf-cell.mid { color: #facc15; }
    .vf-cell.high { color: #4ade80; }

    .actions {
      margin-top: 30px;
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    .btn {
      padding: 12px 20px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-size: 14px;
      background: linear-gradient(135deg, #2563eb, #4f46e5);
      color: #fff;
    }
  </style>
</head>

<body>
<div class="container">

  <div class="title">PREDICTION RESULT</div>
  <div class="subtitle">Visual Field (VF) Prediction from Fundus Image</div>

  <div class="card-grid">

    <!-- Patient Info -->
    <div class="card">
      <h3>Patient Information</h3>

      <div class="info-item">
        <span>Age</span>
        <div id="age">—</div>
      </div>

      <div class="info-item">
        <span>Gender</span>
        <div id="gender">—</div>
      </div>

      <div class="info-item">
        <span>IOP (mmHg)</span>
        <div id="iop">—</div>
      </div>

      <div class="info-item">
        <span>CCT (µm)</span>
        <div id="cct">—</div>
      </div>
    </div>

    <!-- Fundus Image -->
    <div class="card">
      <h3>Fundus Image (Input)</h3>
      <img id="fundusImage" class="fundus-img" />
    </div>

    <!-- VF Output -->
    <div class="card">
      <h3>Predicted Visual Field (dB)</h3>
      <div class="vf-grid" id="vfGrid"></div>
    </div>

  </div>

  <div class="actions">
    <button class="btn" onclick="window.print()">Download Report</button>
    <button class="btn" onclick="location.href='feedback.html'">Submit Feedback</button>
  </div>

</div>

<script>
  const data = JSON.parse(localStorage.getItem("predictionData"));

  if (data) {
    document.getElementById("age").innerText = data.age;
    document.getElementById("gender").innerText = data.gender;
    document.getElementById("iop").innerText = data.iop;
    document.getElementById("cct").innerText = data.cct;
    document.getElementById("fundusImage").src = data.fundusImage;

    const vfGrid = document.getElementById("vfGrid");

    data.vfValues.flat().forEach(val => {
      const cell = document.createElement("div");
      cell.className = "vf-cell";

      if (val < 15) cell.classList.add("low");
      else if (val < 25) cell.classList.add("mid");
      else cell.classList.add("high");

      cell.innerText = val;
      vfGrid.appendChild(cell);
    });
  }
</script>

</body>
</html>
