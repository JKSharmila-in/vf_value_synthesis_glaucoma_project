<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prediction Result | VF Value Synthesis</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 1100px;
      margin: 40px auto;
      background: #ffffff;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
      color: #2c3e50;
    }

    .vf-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
      gap: 10px;
    }

    .vf-cell {
      background: #eaf2f8;
      border-radius: 6px;
      padding: 10px;
      text-align: center;
      font-size: 14px;
      color: #2c3e50;
    }

    .vf-cell span {
      display: block;
      font-weight: bold;
      margin-top: 5px;
    }

    .error {
      text-align: center;
      color: red;
      font-size: 18px;
    }

    .back-btn {
      display: block;
      margin: 30px auto 0;
      padding: 12px 20px;
      background: #2c3e50;
      color: white;
      text-align: center;
      width: 200px;
      border-radius: 6px;
      text-decoration: none;
    }

    .back-btn:hover {
      background: #1a252f;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Visual Field Prediction Result</h1>

    <div id="vfContainer" class="vf-grid"></div>

    <p id="errorText" class="error"></p>

    <a href="/" class="back-btn">Back to Home</a>
  </div>

  <script>
    const vfContainer = document.getElementById("vfContainer");
    const errorText = document.getElementById("errorText");

    const vfValuesRaw = sessionStorage.getItem("vf_values");

    if (!vfValuesRaw) {
      errorText.innerText = "No prediction data found. Please upload an image again.";
    } else {
      const vfValues = JSON.parse(vfValuesRaw);

      vfValues.forEach((value, index) => {
        const cell = document.createElement("div");
        cell.className = "vf-cell";

        cell.innerHTML = `
          Point ${index + 1}
          <span>${Number(value).toFixed(2)}</span>
        `;

        vfContainer.appendChild(cell);
      });
    }
  </script>

</body>
</html>
